  overtime_pay: Float
  salary_earned: Float
  additional_income: Float!
  deductions: Float!
  absence_deduction: Float!
  total_income: Float!
  expenses: Float!
  savings: Float!
  loan_deductions: Float!
  loan_payments: Float!
  loan_received: Float!
  other_income: Float!
  remaining: Float!
  days_worked: Int!
  days_absent: Int!
  days_late: Int!
  days_leave: Int!
  days_incomplete: Int!
  worked_minutes: Int!
  regular_minutes: Int!
  overtime_minutes: Int!

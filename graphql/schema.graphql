"""
Salary Tracker GraphQL API (POST /api/graphql, `Authorization: Bearer <token>`).

Every type mirrors the JSON of the matching REST endpoint (same snake_case
fields, same numbers), and every resolver runs through the same services and
validation rules, so the two APIs never disagree.
"""

scalar JSON @scalar(class: "App\\GraphQL\\Scalars\\JSON")

# ---------------------------------------------------------------------------
# Queries
# ---------------------------------------------------------------------------
type Query {
  "The signed-in account."
  me: User! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@me")
  "Everything the Home screen needs in one call."
  dashboard: Dashboard! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@dashboard")

  profile: Profile! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@profile")
  salarySettings: SalarySettingsPayload! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@salarySettings")
  workSchedule: [WorkScheduleDay!]! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@workSchedule")
  notificationSettings: NotificationSettings! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@notificationSettings")
  notificationPlan: NotificationPlan! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@notificationPlan")

  attendance(range: String, from: String, to: String): AttendanceList! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@attendance")
  attendanceToday: AttendanceToday! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@attendanceToday")
  attendanceRecord(id: Int!): AttendanceRecord! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@attendanceRecord")
  leaveRecords(range: String, from: String, to: String): LeaveList! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@leaveRecords")

  salary: SalaryOverview! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@salary")
  salaryPeriods(count: Int): [SalaryPeriod!]! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@salaryPeriods")
  salarySummary(range: String, from: String, to: String): SalarySummaryPayload! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@salarySummary")
  salaryAdjustments(range: String, from: String, to: String): AdjustmentList! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@salaryAdjustments")

  expenses(range: String, from: String, to: String, category_id: Int, search: String, per_page: Int, page: Int): ExpenseList! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@expenses")
  expenseSummary(range: String, from: String, to: String): ExpenseSummary! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@expenseSummary")
  expense(id: Int!): Expense! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@expense")
  expenseCategories: [ExpenseCategory!]! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@expenseCategories")

  statistics(range: String, from: String, to: String): Statistics! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@statistics")
  calendar(year: Int, month: Int): CalendarMonth! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@calendar")

  goals: [SavingsGoal!]! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@goals")
  savings(range: String, from: String, to: String): SavingsOverview! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@savings")
  savingsTransactions(range: String, from: String, to: String, goal_id: Int): SavingsTransactionList! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@savingsTransactions")
  wallets: [Wallet!]! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@wallets")

  "Money owed and money lent. status: active | paid | closed | all"
  loans(status: String): [Loan!]! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@loans")
  loan(id: Int!): Loan! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@loan")
  loansOverview(range: String, from: String, to: String): LoanOverview! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@loansOverview")
  "Other income (side hustle, freelance, gifts…) in a range."
  incomes(range: String, from: String, to: String): IncomeList! @guard @field(resolver: "App\\GraphQL\\Queries\\ApiQueries@incomes")
}

# ---------------------------------------------------------------------------
# Mutations
# ---------------------------------------------------------------------------
type Mutation {
  login(input: LoginInput!): AuthPayload! @throttle(name: "auth") @field(resolver: "App\\GraphQL\\Mutations\\AuthMutations@login")
  register(input: RegisterInput!): AuthPayload! @throttle(name: "auth") @field(resolver: "App\\GraphQL\\Mutations\\AuthMutations@register")
  logout: Result! @guard @field(resolver: "App\\GraphQL\\Mutations\\AuthMutations@logout")

  updateProfile(input: ProfileInput!): Profile! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@updateProfile")
  updateSalarySettings(input: SalarySettingsInput!): SalarySettingsPayload! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@updateSalarySettings")
  updateWorkSchedule(days: [WorkScheduleDayInput!]!): [WorkScheduleDay!]! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@updateWorkSchedule")
  updateNotificationSettings(input: NotificationSettingsInput!): NotificationSettings! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@updateNotificationSettings")

  timeIn(input: AttendanceActionInput): AttendanceActionResult! @guard @throttle(name: "attendance") @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@timeIn")
  timeOut(input: AttendanceActionInput): AttendanceActionResult! @guard @throttle(name: "attendance") @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@timeOut")
  saveManualAttendance(input: ManualAttendanceInput!): AttendanceRecord! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@saveManualAttendance")
  updateAttendance(id: Int!, input: ManualAttendanceInput!): AttendanceRecord! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@updateAttendance")
  deleteAttendance(id: Int!): Result! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@deleteAttendance")

  createLeave(input: LeaveInput!): LeaveRecord! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@createLeave")
  updateLeave(id: Int!, input: LeaveInput!): LeaveRecord! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@updateLeave")
  deleteLeave(id: Int!): Result! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@deleteLeave")

  createAdjustment(input: AdjustmentInput!): SalaryAdjustment! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@createAdjustment")
  updateAdjustment(id: Int!, input: AdjustmentInput!): SalaryAdjustment! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@updateAdjustment")
  deleteAdjustment(id: Int!): Result! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@deleteAdjustment")

  createExpense(input: ExpenseInput!): Expense! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@createExpense")
  updateExpense(id: Int!, input: ExpenseInput!): Expense! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@updateExpense")
  deleteExpense(id: Int!): Result! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@deleteExpense")
  createExpenseCategory(input: ExpenseCategoryInput!): ExpenseCategory! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@createExpenseCategory")
  updateExpenseCategory(id: Int!, input: ExpenseCategoryInput!): ExpenseCategory! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@updateExpenseCategory")
  deleteExpenseCategory(id: Int!): Result! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@deleteExpenseCategory")

  createGoal(input: GoalInput!): SavingsGoal! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@createGoal")
  updateGoal(id: Int!, input: GoalInput!): SavingsGoal! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@updateGoal")
  deleteGoal(id: Int!): Result! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@deleteGoal")

  createSavingsTransaction(input: SavingsTransactionInput!): SavingsTransaction! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@createSavingsTransaction")
  updateSavingsTransaction(id: Int!, input: SavingsTransactionInput!): SavingsTransaction! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@updateSavingsTransaction")
  deleteSavingsTransaction(id: Int!): Result! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@deleteSavingsTransaction")

  createWallet(input: WalletInput!): Wallet! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@createWallet")
  updateWallet(id: Int!, input: WalletInput!): Wallet! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@updateWallet")
  deleteWallet(id: Int!): Result! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@deleteWallet")

  createLoan(input: LoanInput!): Loan! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@createLoan")
  updateLoan(id: Int!, input: LoanInput!): Loan! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@updateLoan")
  deleteLoan(id: Int!): Result! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@deleteLoan")
  createLoanPayment(loan_id: Int!, input: LoanPaymentInput!): LoanPayment! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@createLoanPayment")
  updateLoanPayment(id: Int!, input: LoanPaymentInput!): LoanPayment! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@updateLoanPayment")
  deleteLoanPayment(id: Int!): Result! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@deleteLoanPayment")
  createIncome(input: IncomeInput!): Income! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@createIncome")
  updateIncome(id: Int!, input: IncomeInput!): Income! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@updateIncome")
  deleteIncome(id: Int!): Result! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@deleteIncome")

  registerDeviceToken(input: DeviceTokenInput!): DeviceToken! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@registerDeviceToken")
  deleteDeviceToken(id: Int!): Result! @guard @field(resolver: "App\\GraphQL\\Mutations\\ApiMutations@deleteDeviceToken")
}

# ---------------------------------------------------------------------------
# Auth / profile / settings
# ---------------------------------------------------------------------------
type Result {
  success: Boolean!
  message: String
}

type AuthPayload {
  token: String!
  user: User!
}

type User {
  id: Int!
  name: String!
  email: String!
  profile: Profile
  salary_configured: Boolean
  created_at: String
}

type Profile {
  full_name: String
  nickname: String
  position: String
  company: String
  employment_type: String
  timezone: String!
  currency: String!
  late_grace_minutes: Int!
}

type SalarySettings {
  configured: Boolean!
  salary_type: String
  basic_salary: Float
  daily_rate: Float
  hourly_rate: Float
  weekly_rate: Float
  biweekly_rate: Float
  monthly_rate: Float
  expected_hours_per_day: Float!
  overtime_enabled: Boolean!
  overtime_multiplier: Float!
  overtime_hourly_rate: Float
  prorate_undertime: Boolean!
  deduct_absences: Boolean!
  period_type: String
  period_start_day: Int
  period_second_day: Int
  period_start_weekday: Int
  period_anchor_date: String
  custom_period_days: Int
  pay_delay_days: Int
  overtime_threshold_minutes: Int
}

type SalaryRates {
  configured: Boolean!
  salary_type: String
  basic_per_period: Float
  monthly_equivalent: Float
  daily_rate: Float
  hourly_rate: Float
  overtime_hourly_rate: Float
  expected_hours_per_day: Float!
  overtime_enabled: Boolean!
  overtime_threshold_minutes: Int!
}

type SalarySettingsPayload {
  settings: SalarySettings!

# Nixpacks build for the Laravel API (Dokploy / Coolify / Railway).
#
# Why this file exists: the default PHP build leaves `bootstrap/cache` and
# `storage` owned by root while php-fpm runs as an unprivileged user, so the app
# cannot write its caches ("Permission denied" -> 500). It also has to install the
# Composer packages from the committed composer.lock (nuwave/lighthouse for the
# GraphQL API) and run the database migrations on every deploy.
#
# The setup phase is left to the PHP provider (php from composer.json, composer,
# nginx, php-fpm, perl). The start command MUST stay on one line: Nixpacks writes
# it into a Dockerfile `CMD ["..."]`, which cannot contain line breaks.

[phases.install]
cmds = ["composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader"]

[phases.build]
cmds = [
  "php artisan package:discover --ansi",
  "php artisan view:cache",
  "mkdir -p storage/framework/cache/lighthouse-queries storage/framework/sessions storage/framework/views storage/logs bootstrap/cache",
  "chmod -R ugo+rwX storage bootstrap/cache",
]

[start]
# migrate -> clear config -> warm the GraphQL schema cache -> start the Laravel scheduler in the
# background (`schedule:work` ticks every minute: recurring bills are recorded at 07:00 Manila,
# so no cron / extra service has to be created on the platform) -> php-fpm + nginx (same as the
# stock PHP image, with the upload limit raised to 20 MB for profile pictures; falls back to
# `artisan serve` if the image layout ever differs).
cmd = "php artisan migrate --force --no-interaction && php artisan config:clear && php artisan lighthouse:cache && chmod -R ugo+rwX storage bootstrap/cache; (php artisan schedule:work > storage/logs/scheduler.log 2>&1 &); if [ -f /assets/scripts/prestart.pl ]; then grep -q client_max_body_size /assets/nginx.template.conf || sed -i 's/http {/http {\n    client_max_body_size 20M;/' /assets/nginx.template.conf; perl /assets/scripts/prestart.pl /assets/nginx.template.conf /nginx.conf && (php-fpm -y /assets/php-fpm.conf -d upload_max_filesize=20M -d post_max_size=20M & nginx -c /nginx.conf); else php artisan serve --host=0.0.0.0 --port=${PORT:-80}; fi"
